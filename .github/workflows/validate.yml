name: Validate portfolio snapshot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate sanitized workflow snapshot
        run: |
          node scripts/validate-portfolio-workflows.mjs
          node scripts/validate-portal-code.mjs

      - name: Rebuild deterministic portfolio demo
        run: |
          node scripts/build-portfolio-demo.mjs
          git diff --exit-code -- docs/demo

      - name: Validate workflow JSON and policy
        shell: pwsh
        run: |
          Get-ChildItem workflows -Filter '*.json' | ForEach-Object {
            Get-Content -Raw $_.FullName | ConvertFrom-Json -Depth 100 | Out-Null
          }
          pwsh -NoProfile -File scripts/validate-workflows.ps1
